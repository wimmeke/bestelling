<!DOCTYPE html>
<html lang="nl">
<head>
  <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <title>Drankbestelling</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 20px;
    }
    h2 {
    color: #333;
    margin-top: 0;
    margin-bottom: 15px;
    }
    .top-balk {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      max-width: 400px;
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .drank-blok {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
      max-width: 400px;
      margin-bottom: 20px;
    }
    .drank {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
    }
    .drank span:first-child {
      flex: 1;
    }
    .bediening {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 18px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .aantal {
      width: 30px;
      text-align: center;
      font-weight: bold;
    }
    #reset {
      background-color: #dc3545;
    }
    #reset:hover {
      background-color: #b02a37;
    }
  </style>
</head>
<body>

  <div class="top-balk">
    <div>Totaal aantal drankjes: <span id="totaalAantal">0</span></div>
    <button id="reset" onclick="resetAlles()">Reset</button>
  </div>

  <!-- Categorieën en dranken worden geladen uit dranken.js -->
  <div id="drankenContainer"></div>

  <script src="dranken.js"></script>
  <script>
    function renderDranken() {
      const container = document.getElementById("drankenContainer");
      container.innerHTML = "";

      drankData.forEach(categorie => {
        const blok = document.createElement("div");
        blok.className = "drank-blok";
        blok.id = categorie.id;

        const titel = document.createElement("h2");
        titel.textContent = categorie.naam;
        blok.appendChild(titel);

        categorie.dranken.forEach(drank => {
          const rij = document.createElement("div");
          rij.className = "drank";

          const naam = document.createElement("span");
          naam.textContent = drank.naam;

          const bediening = document.createElement("div");
          bediening.className = "bediening";

          const min = document.createElement("button");
          min.textContent = "-";
          min.addEventListener("click", () => verlaag(drank.id));

          const aantal = document.createElement("span");
          aantal.id = drank.id;
          aantal.className = "aantal";
          aantal.textContent = "0";

          const plus = document.createElement("button");
          plus.textContent = "+";
          plus.addEventListener("click", () => verhoog(drank.id));

          bediening.append(min, aantal, plus);
          rij.append(naam, bediening);
          blok.appendChild(rij);
        });

        container.appendChild(blok);
      });
    }

    function verhoog(id) {
      const el = document.getElementById(id);
      el.textContent = parseInt(el.textContent) + 1;
      updateTotaal();
    }

    function verlaag(id) {
      const el = document.getElementById(id);
      const value = parseInt(el.textContent);
      if (value > 0) el.textContent = value - 1;
      updateTotaal();
    }

    function updateTotaal() {
      let totaal = 0;
      document.querySelectorAll(".aantal").forEach(el => {
        totaal += parseInt(el.textContent);
      });
      document.getElementById("totaalAantal").textContent = totaal;
    }

    function resetAlles() {
      document.querySelectorAll(".aantal").forEach(el => el.textContent = "0");
      document.getElementById("totaalAantal").textContent = "0";
    }

    renderDranken();
  </script>

</body>
</html>
